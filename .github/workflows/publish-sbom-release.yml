name: Publish SBOM release asset

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag that will receive the durable SBOM assets
        required: false
        default: upstream-v0.85.1
      runtime_ref:
        description: Accepted rs-ai runtime ref to check out and embed in SBOM provenance
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  publish-sbom:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RUNTIME_REF: ${{ inputs.runtime_ref }}
      PROJECT_TMP_BASE: ${{ runner.temp }}
      PROJECT_TMP_ROOT: ${{ runner.temp }}/rs-ai
      RS_AI_TMP_ROOT: ${{ runner.temp }}/rs-ai
      RS_AI_RUN_DIR: ${{ runner.temp }}/rs-ai/runs/publisher/${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_HOME: ${{ runner.temp }}/rs-ai/cache/cargo
      CARGO_TARGET_DIR: ${{ runner.temp }}/rs-ai/build/cargo-target
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/rs-ai/cache/python/pycache
      npm_config_cache: ${{ runner.temp }}/rs-ai/cache/npm
      BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/rs-ai/cache/bun
      XDG_CACHE_HOME: ${{ runner.temp }}/rs-ai/cache/xdg
      TMPDIR: ${{ runner.temp }}/rs-ai/runs/publisher/${{ github.run_id }}-${{ github.run_attempt }}/tmp
      TMP: ${{ runner.temp }}/rs-ai/runs/publisher/${{ github.run_id }}-${{ github.run_attempt }}/tmp
      TEMP: ${{ runner.temp }}/rs-ai/runs/publisher/${{ github.run_id }}-${{ github.run_attempt }}/tmp
    steps:
      - name: Initialize project cache and scratch paths
        run: |
          mkdir -p "${CARGO_HOME}" "${CARGO_TARGET_DIR}" "${PYTHONPYCACHEPREFIX}" \
            "${npm_config_cache}" "${BUN_INSTALL_CACHE_DIR}" "${XDG_CACHE_HOME}" "${TMPDIR}"
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
      - name: Validate workflow inputs
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "release_tag input must not be empty" >&2
            exit 1
          fi
          if [[ -z "${RUNTIME_REF}" ]]; then
            echo "runtime_ref input is required" >&2
            exit 1
          fi
          runtime_ref_lower="$(printf '%s' "${RUNTIME_REF}" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "${runtime_ref_lower}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "runtime_ref must be a full 40-character hexadecimal commit SHA" >&2
            exit 1
          fi
          echo "RUNTIME_REF_LOWER=${runtime_ref_lower}" >> "${GITHUB_ENV}"
          if [[ "${RELEASE_TAG}" =~ ^upstream-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            release_kind="upstream"
            release_version="${BASH_REMATCH[1]}"
          elif [[ "${RELEASE_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            release_kind="native"
            release_version="${BASH_REMATCH[1]}"
          else
            echo "release_tag must match upstream-vX.Y.Z or vX.Y.Z: ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "RELEASE_KIND=${release_kind}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"

      - name: Checkout accepted runtime ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.runtime_ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_HOME }}/bin/cargo-audit
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install pinned cargo-audit
        run: |
          set -euo pipefail
          if ! command -v cargo-audit >/dev/null || ! cargo-audit --version | grep -q 'cargo-audit 0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi

      - name: Generate and validate SBOM/security/license gates
        run: |
          set -euo pipefail
          make security-check

      - name: Record resolved runtime ref
        run: git rev-parse HEAD > .runtime-ref

      - name: Verify SBOM provenance and normalize release asset names
        run: |
          set -euo pipefail
          resolved_ref="$(cat .runtime-ref)"
          if [[ "${resolved_ref}" != "${RUNTIME_REF_LOWER}" ]]; then
            echo "Checked-out HEAD ${resolved_ref} does not match runtime_ref ${RUNTIME_REF_LOWER}" >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          sbom_path = Path("artifacts/sbom.cdx.json")
          expected = Path(".runtime-ref").read_text().strip()
          data = json.loads(sbom_path.read_text())
          root = data.get("metadata", {}).get("component", {})
          props = root.get("properties", [])
          revision = None
          for prop in props:
              if isinstance(prop, dict) and prop.get("name") == "rs-ai:vcs:revision":
                  revision = prop.get("value")
                  break
          if revision != expected:
              raise SystemExit(f"SBOM rs-ai:vcs:revision mismatch: expected {expected}, got {revision}")
          if os.environ["RELEASE_KIND"] == "native" and root.get("version") != os.environ["RELEASE_VERSION"]:
              raise SystemExit(
                  "SBOM root version mismatch: "
                  f"expected {os.environ['RELEASE_VERSION']}, got {root.get('version')}"
              )
          print(f"SBOM provenance revision verified: {revision}")
          PY

          mkdir -p dist
          cp artifacts/sbom.cdx.json dist/sbom.cdx.json
          sha256sum dist/sbom.cdx.json | sed 's#  dist/#  #' > dist/sbom.cdx.json.sha256
          test "$(awk '{print $2}' dist/sbom.cdx.json.sha256)" = "sbom.cdx.json"
          (cd dist && sha256sum --check sbom.cdx.json.sha256 --strict --status)

      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_KIND}" == "native" ]]; then
            title="rs-ai v${RELEASE_VERSION}"
            notes="Native rs-ai v${RELEASE_VERSION} release at accepted runtime ref ${RUNTIME_REF_LOWER}. CycloneDX assets: sbom.cdx.json and sbom.cdx.json.sha256."
          else
            title="SBOM for @earendil-works/pi-ai v${RELEASE_VERSION}"
            notes="CycloneDX SBOM generated from accepted rs-ai runtime ref ${RUNTIME_REF_LOWER} for @earendil-works/pi-ai v${RELEASE_VERSION}. Assets: sbom.cdx.json and sbom.cdx.json.sha256."
          fi
          runtime_sha="$(git rev-parse HEAD)"
          git fetch --force --tags origin

          release_exists=false
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            release_exists=true
          fi

          tag_exists=false
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            tag_exists=true
            tag_target="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            if [[ "${tag_target}" != "${runtime_sha}" ]]; then
              echo "Release tag ${RELEASE_TAG} points to ${tag_target}, not checked-out runtime ${runtime_sha}" >&2
              exit 1
            fi
            if [[ "${RELEASE_KIND}" == "native" ]]; then
              ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
              tag_object_type="$(jq -r '.object.type' <<<"${ref_json}")"
              tag_object_sha="$(jq -r '.object.sha' <<<"${ref_json}")"
              if [[ "${tag_object_type}" != "tag" ]]; then
                echo "Native release tag ${RELEASE_TAG} must be annotated" >&2
                exit 1
              fi
              tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
              tagger_name="$(jq -r '.tagger.name' <<<"${tag_json}")"
              tagger_email="$(jq -r '.tagger.email' <<<"${tag_json}")"
              tagged_type="$(jq -r '.object.type' <<<"${tag_json}")"
              tagged_sha="$(jq -r '.object.sha' <<<"${tag_json}")"
              if [[ "${tagger_name}" != "Rui Carmo" || "${tagger_email}" != "rui.carmo@gmail.com" ]]; then
                echo "Native release tag ${RELEASE_TAG} must be authored by Rui Carmo <rui.carmo@gmail.com>" >&2
                exit 1
              fi
              if [[ "${tagged_type}" != "commit" || "${tagged_sha}" != "${runtime_sha}" ]]; then
                echo "Native release tag object ${tag_object_sha} does not target runtime ${runtime_sha}" >&2
                exit 1
              fi
            fi
          elif [[ "${release_exists}" == "true" ]]; then
            echo "Release ${RELEASE_TAG} exists but its tag was not found after fetching origin tags" >&2
            exit 1
          fi

          if [[ "${RELEASE_KIND}" == "native" && "${tag_exists}" == "false" ]]; then
            echo "Native release tag ${RELEASE_TAG} must be created before publisher dispatch" >&2
            exit 1
          fi

          if [[ "${release_exists}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" \
              --title "${title}" \
              --notes "${notes}"
          elif [[ "${RELEASE_KIND}" == "native" ]]; then
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${title}" \
              --notes "${notes}"
          else
            gh release create "${RELEASE_TAG}" \
              --target "${runtime_sha}" \
              --title "${title}" \
              --notes "${notes}"
          fi
          gh release upload "${RELEASE_TAG}" \
            dist/sbom.cdx.json \
            dist/sbom.cdx.json.sha256 \
            --clobber
