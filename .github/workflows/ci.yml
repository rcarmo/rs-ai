name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly supply-chain maintenance: rerun SBOM/license/RustSec gates between releases.
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    env:
      PROJECT_TMP_BASE: ${{ runner.temp }}
      PROJECT_TMP_ROOT: ${{ runner.temp }}/rs-ai
      RS_AI_TMP_ROOT: ${{ runner.temp }}/rs-ai
      RS_AI_RUN_DIR: ${{ runner.temp }}/rs-ai/runs/ci/${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_HOME: ${{ runner.temp }}/rs-ai/cache/cargo
      CARGO_TARGET_DIR: ${{ runner.temp }}/rs-ai/build/cargo-target
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/rs-ai/cache/python/pycache
      npm_config_cache: ${{ runner.temp }}/rs-ai/cache/npm
      BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/rs-ai/cache/bun
      XDG_CACHE_HOME: ${{ runner.temp }}/rs-ai/cache/xdg
      TMPDIR: ${{ runner.temp }}/rs-ai/runs/ci/${{ github.run_id }}-${{ github.run_attempt }}/tmp
      TMP: ${{ runner.temp }}/rs-ai/runs/ci/${{ github.run_id }}-${{ github.run_attempt }}/tmp
      TEMP: ${{ runner.temp }}/rs-ai/runs/ci/${{ github.run_id }}-${{ github.run_attempt }}/tmp
    steps:
      - name: Initialize project cache and scratch paths
        run: |
          mkdir -p "${CARGO_HOME}" "${CARGO_TARGET_DIR}" "${PYTHONPYCACHEPREFIX}" \
            "${npm_config_cache}" "${BUN_INSTALL_CACHE_DIR}" "${XDG_CACHE_HOME}" "${TMPDIR}"
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.CARGO_HOME }}/bin/cargo-audit
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install pinned cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null || ! cargo-audit --version | grep -q 'cargo-audit 0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --all-targets
      # Static-analysis-clean gate: any warning fails the build.
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Generate and validate SBOM
        run: make sbom && make sbom-check
      - name: License wrapper self-test
        run: make license-check-selftest
      - name: License review
        run: make license-check
      - name: Vulnerability wrapper self-test
        run: make vuln-check-selftest
      - name: Vulnerability scan
        run: make vuln-check
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rs-ai-sbom-${{ github.sha }}
          path: |
            artifacts/sbom.cdx.json
            artifacts/sbom.cdx.json.sha256
          if-no-files-found: error
          retention-days: 30
