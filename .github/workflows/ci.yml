name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install pinned cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null || ! cargo-audit --version | grep -q 'cargo-audit 0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --all-targets
      # Static-analysis-clean gate: any warning fails the build.
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Generate and validate SBOM
        run: make sbom && make sbom-check
      - name: License wrapper self-test
        run: make license-check-selftest
      - name: License review
        run: make license-check
      - name: Vulnerability wrapper self-test
        run: make vuln-check-selftest
      - name: Vulnerability scan
        run: make vuln-check
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rs-ai-sbom
          path: |
            artifacts/sbom.cdx.json
            artifacts/sbom.cdx.json.sha256
          if-no-files-found: error
          retention-days: 14
