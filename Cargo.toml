[package]
name = "rs-ai"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Unified LLM API — Rust port of @earendil-works/pi-ai"
repository = "https://github.com/rcarmo/rs-ai"
keywords = ["llm", "ai", "streaming", "openai", "anthropic"]
categories = ["api-bindings", "asynchronous"]
publish = false

[lib]
name = "rs_ai"

[features]
default = ["bedrock"]
bedrock = [
    "dep:aws-sdk-bedrockruntime",
    "dep:aws-config",
    "dep:aws-smithy-types",
    "dep:aws-smithy-runtime-api",
]

[dependencies]
httpdate = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
zstd = "0.13"
url = "2"
async-stream = "0.3"

# Rustls-backed HTTP client — no OpenSSL dependency
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }

# Rustls-backed WebSocket — no OpenSSL dependency
tokio-tungstenite = { version = "0.26", default-features = false, features = ["rustls-tls-webpki-roots", "connect", "handshake"] }

# Bedrock (optional — requires cmake at build time for aws-lc-rs)
aws-sdk-bedrockruntime = { version = "1", optional = true }
aws-config             = { version = "1", optional = true }
aws-smithy-types       = { version = "1", optional = true }
aws-smithy-runtime-api = { version = "1", optional = true }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"

[workspace]
members = ["."]
